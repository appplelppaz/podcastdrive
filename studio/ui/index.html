<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header>
    <h1>Listening Studio</h1>
    <button id="make" class="button" type="button" hidden>Make</button>
    <button id="stop" class="link" type="button" hidden>Stop</button>
  </header>
  <ul id="needs" class="needs"></ul>

  <div class="head"><h2>Inbox</h2><button class="link" data-open="inbox" type="button">Open folder</button></div>
  <ul id="episodes" class="episodes"></ul>
  <p id="empty" class="hint" hidden>Put an audio file here. Add its <code>.ttml</code> if you have one.</p>
  <p id="log" class="log"></p>

  <div class="head"><h2>Ready</h2>
    <span class="pick"><button id="move" class="link" type="button" hidden>Move to Drive</button><button class="link" data-open="ready" type="button">Open folder</button></span></div>
  <ul id="readyList" class="episodes"></ul>
  <p id="readyEmpty" class="hint">Nothing here yet.</p>
  <p id="moveError" class="hint error"></p>

  <div class="head"><h2>Drive</h2><button class="link" data-open="drive" type="button">Open folder</button></div>
  <p id="driveInfo" class="hint"></p>

  <h2 class="gap">Settings</h2>
  <div class="row"><label for="level">Level</label>
    <select id="level"><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option></select></div>
  <div class="row" id="voiceRow"><label for="voice">Voice</label>
    <span class="pick"><select id="voice"></select><button id="test" class="link" type="button">Test</button></span></div>
  <div class="row"><label for="inbox">Inbox</label><input id="inbox" type="text" spellcheck="false"></div>
  <div class="row"><label for="ready">Ready</label><input id="ready" type="text" spellcheck="false"></div>
  <div class="row"><label for="drive">Drive</label><input id="drive" type="text" spellcheck="false"></div>
</main>
<script src="app.js"></script>
</body>
</html>
